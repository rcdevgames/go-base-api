version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - APP_PORT=8080
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=modmonolith
      - DB_SSL_MODE=disable
      - JWT_SECRET=changeme
      - INTER_SERVICE_TOKEN=internal-token
      - JWT_EXPIRATION_MINUTES=60
      - BCRYPT_COST=10
      - REFRESH_SECRET=changemerefresh
      - REFRESH_EXPIRATION_MINUTES=1440
      - STORAGE_PROVIDER=local
      - LOCAL_UPLOAD_DIR=upload
      - CDN_BASE_URL=http://localhost:8080/cdn
    depends_on:
      - db
    volumes:
      - ./logs:/root/logs
      - ./upload:/root/upload
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=modmonolith
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Optional: MinIO for S3 testing
  minio:
    image: minio/minio
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network

volumes:
  postgres_data:
  minio_data:

networks:
  app-network:
    driver: bridge